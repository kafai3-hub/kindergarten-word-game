<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Word Game - 中英文單詞認字遊戲 (Cantonese)</title>
<meta property="og:title" content="Kindergarten Word Game 🌟 中英文單詞遊戲">
<meta property="og:description" content="Fun kindergarten game to learn Traditional Chinese & English words with Cantonese pronunciation!">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f31f.png">
<meta property="og:url" content="https://kafai3-hub.github.io/kindergarten-word-game/">
<meta name="twitter:card" content="summary_large_image">
<style>
body { font-family: 'Arial', 'Microsoft JhengHei', sans-serif; background: #e0f7fa; margin: 0; padding: 20px; text-align: center; }
h1 { color: #00796b; font-size: 2.2em; margin-bottom: 10px; }
.tabs { margin: 15px 0; }
.tab { background: #4db6ac; color: white; border: none; padding: 12px 25px; font-size: 1.1em; margin: 5px; border-radius: 10px; cursor: pointer; }
.tab.active { background: #00796b; }
.section { display: none; }
.section.active { display: block; }
.word-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 320px; margin: 20px auto; }
.chinese { font-size: 3.5em; color: #d32f2f; font-weight: bold; margin: 10px 0; }
.english { font-size: 2.8em; color: #388e3c; font-weight: bold; }
.pattern { font-size: 1.1em; color: #1976d2; margin: 8px 0; }
.highlight { color: #e65100; font-weight: bold; background: #fff3e0; padding: 2px 6px; border-radius: 4px; }
.emoji { font-size: 5em; }
button { font-size: 1.1em; padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; margin: 5px; }
button.pronounce { background: #ff9800; color: white; }
button.pronounce:disabled { background: #ccc; cursor: not-allowed; }
button.nav { background: #4db6ac; color: white; }
button.share { background: #25D366; color: white; font-size: 1.1em; padding: 12px 25px; }
.option { background: #bbdefb; margin: 10px auto; padding: 20px; border-radius: 12px; font-size: 2em; cursor: pointer; max-width: 300px; font-weight: bold; }
.option.correct { background: #81c784; }
.option.wrong { background: #e57373; }
.stars { font-size: 1.8em; margin: 10px; }
.progress { margin: 15px; font-size: 1.1em; color: #00796b; }
.group-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 20px; }
.group-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); min-width: 180px; }
#quiz-area { margin-top: 15px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
</head>
<body>
<h1>🌟 Kindergarten Word Game 🌟<br>中英文單詞認字 & 粵語發音遊戲</h1>
<div class="tabs">
  <button class="tab active" onclick="showSection('chinese')">中文 Chinese</button>
  <button class="tab" onclick="showSection('english')">English 英文</button>
  <button class="tab" onclick="showSection('similar')">Similar Sounds 相似音</button>
</div>
<button class="share" onclick="shareWhatsApp()">📤 Share on WhatsApp</button>

<div id="chinese" class="section active">
  <h2>中文單詞 - 聽粵語發音</h2>
  <div id="chinese-content"></div>
</div>

<div id="english" class="section">
  <h2>English Words - Listen & Learn</h2>
  <div id="english-content"></div>
</div>

<div id="similar" class="section">
  <h2>Similar Sounds Practice - 相似發音練習</h2>
  <p>聽聲音，選擇正確的單詞</p>
  <button onclick="startSimilarQuiz()" style="font-size:1.2em; padding:10px 20px;">Start / Next Quiz</button>
  <div id="similar-content"></div>
  <div id="quiz-area"></div>
</div>

<script>
const chineseWords = [
  { zh: "起床", emoji: "🛏️" },
  { zh: "洗臉", emoji: "🧼" },
  { zh: "刷牙", emoji: "🪥" },
  { zh: "早餐", emoji: "🍳" },
  { zh: "學校", emoji: "🏫" },
  { zh: "玩耍", emoji: "🎮" },
  { zh: "圖畫", emoji: "🎨" },
  { zh: "遊戲", emoji: "🎲" },
  { zh: "課室", emoji: "📚" },
  { zh: "時間", emoji: "⏰" },
  { zh: "旅行", emoji: "✈️" },
  { zh: "風箍", emoji: "🪁" },
  { zh: "老鼠", emoji: "🐭" },
  { zh: "認識", emoji: "👀" },
  { zh: "橙汁", emoji: "🧃" },
  { zh: "乳酪", emoji: "🥛" },
  { zh: "問候", emoji: "👋" },
  { zh: "親切", emoji: "😊" },
  { zh: "生氣", emoji: "😠" },
  { zh: "蛋糕", emoji: "🎂" },
  { zh: "驚慌", emoji: "😱" },
  { zh: "亂跑", emoji: "🏃" },
  { zh: "團結", emoji: "🤝" },
  { zh: "國家", emoji: "🌍" }
];

const englishGroups = [
  { pattern: "-ear", words: ["ear", "hear", "spear"], emoji: ["👂", "👂", "🏹"] },
  { pattern: "-eer", words: ["deer", "beer", "cheer"], emoji: ["🦌", "🍺", "🎉"] },
  { pattern: "-all", words: ["call", "hall", "wall"], emoji: ["📞", "🏛️", "🪡"] },
  { pattern: "-alk", words: ["small", "talk", "walk"], emoji: ["🐜", "🗣️", "🚶"] },
  { pattern: "o_e / ose", words: ["rose", "cone", "coke"], emoji: ["🌹", "🍦", "🥤"] },
  { pattern: "-oat / -oal", words: ["goat", "coal", "float"], emoji: ["🐐", "⚫", "🛶"] },
  { pattern: "-oe / -ore", words: ["toe", "floe", "core"], emoji: ["🦶", "🧊", "🍎"] },
  { pattern: "-ore", words: ["store", "fork", "horse"], emoji: ["🏪", "🍴", "🐴"] }
];

let speaking = false;
let currentSection = 0;
let currentCard = 0;
let sectionStars = 0;
let sectionTotal = 0;

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'chinese') startChineseSection();
  if (id === 'english') startEnglishModule();
}

function speak(text, lang, btn) {
  if (speaking || !('speechSynthesis' in window)) return;
  speaking = true;
  if (btn) btn.disabled = true;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = 0.8;
  const voices = speechSynthesis.getVoices();
  let preferred = null;
  if (lang.startsWith('zh')) {
    preferred = voices.find(v => v.lang === 'zh-HK' || v.lang.startsWith('zh-HK') || v.lang.includes('yue') || (v.name && (v.name.toLowerCase().includes('cantonese') || v.name.toLowerCase().includes('hong kong') || v.name.includes('粵'))));
    if (!preferred) preferred = voices.find(v => v.lang.startsWith('zh'));
  }
  if (preferred) utterance.voice = preferred;
  utterance.onend = () => { speaking = false; if (btn) btn.disabled = false; };
  utterance.onerror = () => { speaking = false; if (btn) btn.disabled = false; };
  speechSynthesis.speak(utterance);
}

function highlightPattern(word, pattern) {
  const clean = pattern.replace(/[^a-zA-Z]/g, '').toLowerCase();
  const lower = word.toLowerCase();
  let idx = lower.lastIndexOf(clean);
  if (idx === -1 && clean.length > 2) {
    for (let len = clean.length - 1; len >= 2; len--) {
      const sub = clean.slice(-len);
      const pos = lower.lastIndexOf(sub);
      if (pos !== -1) { idx = pos; break; }
    }
  }
  if (idx >= 0) {
    return word.slice(0, idx) + '<span class="highlight">' + word.slice(idx) + '</span>';
  }
  return word;
}

function startChineseSection() {
  currentSection = 0;
  currentCard = 0;
  sectionStars = 0;
  sectionTotal = 0;
  renderChineseCard();
}

function renderChineseCard() {
  const start = currentSection * 5;
  const words = chineseWords.slice(start, start + 5);
  if (currentCard >= words.length) {
    document.getElementById('chinese-content').innerHTML = `
      <h3>Section ${currentSection + 1} Complete!</h3>
      <p>Stars this section: ${sectionStars} / ${sectionTotal}</p>
      <button class="nav" onclick="startChineseQuiz()">Start Flashcard Quiz 開始小測</button>
      <button class="nav" onclick="nextChineseSection()">Next Section 下一組</button>
    `;
    return;
  }
  const w = words[currentCard];
  document.getElementById('chinese-content').innerHTML = `
    <div class="progress">Section ${currentSection + 1} · Card ${currentCard + 1} / ${words.length}</div>
    <button class="pronounce" onclick="speak('${w.zh}', 'zh-HK', this)">讀音</button>
    <div class="word-card">
      <div class="emoji">${w.emoji}</div>
      <div class="chinese">${w.zh}</div>
    </div>
    <button class="nav" onclick="nextChineseCard()">Next 下一張</button>
  `;
}

function nextChineseCard() { currentCard++; renderChineseCard(); }

function nextChineseSection() {
  currentSection++;
  currentCard = 0;
  if (currentSection * 5 >= chineseWords.length) {
    document.getElementById('chinese-content').innerHTML = '<h3>All sections complete! 全部完成！</h3>';
    return;
  }
  renderChineseCard();
}

function startChineseQuiz() {
  currentCard = 0;
  sectionStars = 0;
  sectionTotal = 0;
  renderChineseQuiz();
}

function renderChineseQuiz() {
  const start = currentSection * 5;
  const words = chineseWords.slice(start, start + 5);
  if (currentCard >= words.length) {
    document.getElementById('chinese-content').innerHTML = `
      <h3>Quiz Complete!</h3>
      <div class="stars">${'⭐'.repeat(sectionStars)}${'☆'.repeat(Math.max(0, sectionTotal - sectionStars))}</div>
      <p>${sectionStars} / ${sectionTotal} correct</p>
      <button class="nav" onclick="nextChineseSection()">Next Section 下一組</button>
    `;
    return;
  }
  const correct = words[currentCard];
  const options = [correct];
  while (options.length < 3) {
    const rand = chineseWords[Math.floor(Math.random() * chineseWords.length)];
    if (!options.find(o => o.zh === rand.zh)) options.push(rand);
  }
  options.sort(() => Math.random() - 0.5);
  sectionTotal++;
  document.getElementById('chinese-content').innerHTML = `
    <div class="progress">Quiz · ${currentCard + 1} / ${words.length}</div>
    <button class="pronounce" onclick="speak('${correct.zh}', 'zh-HK', this)">讀音</button>
    <div class="word-card">
      <div class="emoji">${correct.emoji}</div>
    </div>
    <div id="quiz-options"></div>
  `;
  const optsDiv = document.getElementById('quiz-options');
  options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt.zh;
    btn.onclick = () => checkChineseAnswer(opt.zh === correct.zh, btn, correct.zh);
    optsDiv.appendChild(btn);
  });
}

function checkChineseAnswer(isCorrect, btn, correctZh) {
  document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
  if (isCorrect) {
    btn.classList.add('correct');
    sectionStars++;
    speak('正確', 'zh-HK');
    if (correctZh === '學校' || correctZh.includes('學')) {
      setTimeout(() => showStrokeOrder('學'), 800);
    }
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.option').forEach(o => { if (o.textContent === correctZh) o.classList.add('correct'); });
    speak('再試一次', 'zh-HK');
  }
  setTimeout(() => { currentCard++; renderChineseQuiz(); }, 1800);
}

function showStrokeOrder(char) {
  const container = document.getElementById('chinese-content');
  const writerDiv = document.createElement('div');
  writerDiv.id = 'stroke-writer';
  writerDiv.style.margin = '20px auto';
  writerDiv.style.width = '200px';
  writerDiv.style.height = '200px';
  container.appendChild(writerDiv);
  const writer = HanziWriter.create('stroke-writer', char, {
    width: 200,
    height: 200,
    padding: 5,
    strokeAnimationSpeed: 1,
    delayBetweenStrokes: 300,
    showOutline: true,
    showCharacter: false
  });
  writer.animateCharacter();
  setTimeout(() => {
    const label = document.createElement('p');
    label.textContent = '筆順示範：' + char;
    label.style.fontSize = '1.2em';
    label.style.color = '#00796b';
    writerDiv.after(label);
  }, 500);
}

function startEnglishModule() {
  currentSection = 0;
  renderEnglishModule();
}

function renderEnglishModule() {
  if (currentSection >= englishGroups.length) {
    document.getElementById('english-content').innerHTML = '<h3>All modules complete!</h3>';
    return;
  }
  const g = englishGroups[currentSection];
  let html = `<div class="progress">Module ${currentSection + 1}: Pattern ${g.pattern}</div>`;
  html += '<div class="group-grid">';
  g.words.forEach((word, i) => {
    const highlighted = highlightPattern(word, g.pattern);
    html += `
      <div class="group-card">
        <div class="emoji">${g.emoji[i]}</div>
        <div class="english">${highlighted}</div>
        <button class="pronounce" onclick="speak('${word}', 'en-US', this)">Listen</button>
      </div>
    `;
  });
  html += '</div>';
  html += `<button class="nav" onclick="startEnglishQuiz()">Start Quiz</button> `;
  html += `<button class="nav" onclick="nextEnglishModule()">Next Module</button>`;
  document.getElementById('english-content').innerHTML = html;
}

function nextEnglishModule() {
  currentSection++;
  renderEnglishModule();
}

function startEnglishQuiz() {
  currentCard = 0;
  sectionStars = 0;
  sectionTotal = 0;
  renderEnglishQuiz();
}

function renderEnglishQuiz() {
  const g = englishGroups[currentSection];
  if (currentCard >= g.words.length) {
    document.getElementById('english-content').innerHTML = `
      <h3>Quiz Complete!</h3>
      <div class="stars">${'⭐'.repeat(sectionStars)}${'☆'.repeat(Math.max(0, sectionTotal - sectionStars))}</div>
      <p>${sectionStars} / ${sectionTotal} correct</p>
      <button class="nav" onclick="nextEnglishModule()">Next Module</button>
    `;
    return;
  }
  const correct = g.words[currentCard];
  const options = [...new Set(g.words)];
  while (options.length < 3) {
    const extra = englishGroups[Math.floor(Math.random()*englishGroups.length)].words[0];
    if (!options.includes(extra)) options.push(extra);
  }
  options.sort(() => Math.random() - 0.5);
  sectionTotal++;
  document.getElementById('english-content').innerHTML = `
    <div class="progress">Quiz · ${currentCard + 1} / ${g.words.length}</div>
    <button class="pronounce" onclick="speak('${correct}', 'en-US', this)">Listen</button>
    <div class="word-card">
      <div class="emoji">${g.emoji[currentCard]}</div>
    </div>
    <div id="quiz-options"></div>
  `;
  const optsDiv = document.getElementById('quiz-options');
  options.slice(0,3).forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onmouseover = () => speak(opt, 'en-US');
    btn.onclick = () => checkEnglishAnswer(opt === correct, btn, correct);
    optsDiv.appendChild(btn);
  });
}

function checkEnglishAnswer(isCorrect, btn, correctWord) {
  document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
  if (isCorrect) {
    btn.classList.add('correct');
    sectionStars++;
    speak('Great job!', 'en-US');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.option').forEach(o => { if (o.textContent === correctWord) o.classList.add('correct'); });
    speak('Try again', 'en-US');
  }
  setTimeout(() => { currentCard++; renderEnglishQuiz(); }, 1200);
}

let currentQuiz = null;
function startSimilarQuiz() {
  const group = englishGroups[Math.floor(Math.random() * englishGroups.length)];
  const correctIdx = Math.floor(Math.random() * group.words.length);
  const correctWord = group.words[correctIdx];
  currentQuiz = { group, correctWord, correctIdx };
  speak(correctWord, 'en-US');
  const area = document.getElementById('quiz-area');
  area.innerHTML = `<h3>What did you hear? (Pattern: ${group.pattern})</h3>
    <button class="pronounce" onclick="speak('${correctWord}', 'en-US', this)">Listen Again</button>
    <div id="sim-options"></div>`;
  const opts = document.getElementById('sim-options');
  group.words.forEach((word, i) => {
    const div = document.createElement('div');
    div.style.margin = '10px';
    div.innerHTML = `<button class="pronounce" onclick="speak('${word}', 'en-US', this)">🔊 ${word}</button>`;
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.textContent = word;
    btn.onclick = () => checkSimilarAnswer(word, btn);
    div.appendChild(btn);
    opts.appendChild(div);
  });
}

function checkSimilarAnswer(selected, btn) {
  document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
  if (selected === currentQuiz.correctWord) {
    btn.classList.add('correct');
    speak('Great job!', 'en-US');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.option').forEach(o => {
      if (o.textContent === currentQuiz.correctWord) o.classList.add('correct');
    });
    speak('Try again', 'en-US');
  }
}

function shareWhatsApp() {
  const url = encodeURIComponent('https://kafai3-hub.github.io/kindergarten-word-game/');
  const text = encodeURIComponent('Check out this fun kindergarten word game! 🌟 Learn Chinese & English with Cantonese pronunciation: ');
  window.open(`https://wa.me/?text=${text}${url}`, '_blank');
}

speechSynthesis.onvoiceschanged = () => {};
startChineseSection();
</script>
</body>
</html>
